<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#009c4b">
  <meta name="description" content="เดินชมพื้นที่โรงเรียนสหวิทยานุสรณ์แบบ 360 องศา">
  <title>สำรวจพื้นที่ 360° — สหวิทยานุสรณ์</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">

</head>
<body class="page-explore">
<header class="site-header tour-header">
  <a class="brand" href="index.html" aria-label="โรงเรียนสหวิทยานุสรณ์ หน้าแรก">
    <span class="brand-mark" aria-hidden="true"><img src="assets/school-seal.png" alt=""></span>
    <span class="brand-copy"><strong>สหวิทยานุสรณ์</strong></span>
  </a>
  <nav class="site-nav" id="siteNav" aria-label="เมนูหลัก">
      <a href="index.html">เกี่ยวกับโรงเรียน</a>
      <a href="places.html">สถานที่ภายในโรงเรียน</a>
      <a class="active" aria-current="page" href="explore.html">สำรวจพื้นที่</a>
      <a href="personnel.html">บุคลากร</a>
      <a class="nav-apply" href="admissions.html">สมัครเรียน <span aria-hidden="true">↗</span></a>
  </nav>
  <div class="header-actions">
    <button class="menu-toggle" id="menuToggle" type="button" aria-label="เมนูหลัก" aria-expanded="false" aria-controls="siteNav">
      <span class="menu-lines" aria-hidden="true"><i></i><i></i></span><span>เมนู</span>
    </button>
  </div>
</header>
<main class="tour-main">
  <section class="campus-tour-page" aria-label="ทัวร์ 360 องศาโรงเรียนสหวิทยานุสรณ์">
    <div class="campus-tour-frame">
      <iframe class="campus-tour-embed" id="tour-embedded" title="ทัวร์ 360° โรงเรียนสหวิทยานุสรณ์" src="https://tour.panoee.net/iframe/6abf2206fce8ddf28c6a1011?embedFullscreen=1&amp;embedVr=0&amp;embedGyro=1" frameborder="0" width="100%" height="100%" scrolling="no" allow="autoplay; accelerometer; gyroscope; fullscreen" loading="eager" allowfullscreen></iframe>
            <script>
              (function () {
                var iframeId = 'tour-embedded';
                var panoeeOrigin = 'https://tour.panoee.net';
                var iframeReady = false;

                function coordinates(values, keys) {
                  if (!values) return null;
                  var result = {};
                  keys.forEach(function (key) {
                    result[key] = typeof values[key] === 'number' ? values[key] : null;
                  });
                  return result;
                }

                function sendToTour(payload) {
                  var iframe = document.getElementById(iframeId);
                  if (!iframe || !iframe.contentWindow) return;
                  try { iframe.contentWindow.postMessage(payload, panoeeOrigin); } catch (error) {}
                }

                var iframe = document.getElementById(iframeId);
                if (iframe) iframe.addEventListener('load', function () { iframeReady = true; });

                window.addEventListener('message', function (event) {
                  if (!iframeReady || !event.data || event.data.type !== 'devicemotion') return;
                  if (event.source !== window.parent) return;
                  sendToTour(event.data);
                }, false);

                window.addEventListener('devicemotion', function (event) {
                  if (!iframeReady) return;
                  sendToTour({
                    type: 'devicemotion',
                    deviceMotionEvent: {
                      acceleration: coordinates(event.acceleration, ['x', 'y', 'z']),
                      accelerationIncludingGravity: coordinates(event.accelerationIncludingGravity, ['x', 'y', 'z']),
                      rotationRate: coordinates(event.rotationRate, ['alpha', 'beta', 'gamma']),
                      interval: typeof event.interval === 'number' ? event.interval : 0,
                      timeStamp: event.timeStamp
                    }
                  });
                }, { passive: true });
              })();
            </script>
    </div>
    <div class="tour-corner-note">
      <span class="tour-dot" aria-hidden="true"></span>
      <div><small>ลากเพื่อมอง · กดลูกศรเพื่อเดิน</small></div>
    </div>
  </section>
</main>
</body>
</html>
