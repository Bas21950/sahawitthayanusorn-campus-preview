<main class="tour-main">
  <section class="campus-tour-page" aria-label="ทัวร์ 360 องศาโรงเรียนสหวิทยานุสรณ์">
    <div class="campus-tour-frame">
      <iframe class="campus-tour-embed" id="tour-embedded" title="ทัวร์ 360° โรงเรียนสหวิทยานุสรณ์" src="https://tour.panoee.net/iframe/6abf2206fce8ddf28c6a1011?embedFullscreen=1&amp;embedVr=0&amp;embedGyro=1" frameborder="0" width="100%" height="100%" scrolling="no" allow="autoplay; accelerometer; gyroscope; fullscreen" loading="eager" allowfullscreen></iframe>
            <script>
              (function () {
                var iframeId = 'tour-embedded';
                var panoeeOrigin = 'https://tour.panoee.net';
                var iframeReady = false;

                function coordinates(values, keys) {
                  if (!values) return null;
                  var result = {};
                  keys.forEach(function (key) {
                    result[key] = typeof values[key] === 'number' ? values[key] : null;
                  });
                  return result;
                }

                function sendToTour(payload) {
                  var iframe = document.getElementById(iframeId);
                  if (!iframe || !iframe.contentWindow) return;
                  try { iframe.contentWindow.postMessage(payload, panoeeOrigin); } catch (error) {}
                }

                var iframe = document.getElementById(iframeId);
                if (iframe) iframe.addEventListener('load', function () { iframeReady = true; });

                window.addEventListener('message', function (event) {
                  if (!iframeReady || !event.data || event.data.type !== 'devicemotion') return;
                  if (event.source !== window.parent) return;
                  sendToTour(event.data);
                }, false);

                window.addEventListener('devicemotion', function (event) {
                  if (!iframeReady) return;
                  sendToTour({
                    type: 'devicemotion',
                    deviceMotionEvent: {
                      acceleration: coordinates(event.acceleration, ['x', 'y', 'z']),
                      accelerationIncludingGravity: coordinates(event.accelerationIncludingGravity, ['x', 'y', 'z']),
                      rotationRate: coordinates(event.rotationRate, ['alpha', 'beta', 'gamma']),
                      interval: typeof event.interval === 'number' ? event.interval : 0,
                      timeStamp: event.timeStamp
                    }
                  });
                }, { passive: true });
              })();
            </script>
    </div>
    <div class="tour-corner-note">
      <span class="tour-dot" aria-hidden="true"></span>
      <div><small>ลากเพื่อมอง · กดลูกศรเพื่อเดิน</small></div>
    </div>
  </section>
